name: ROS 2 Humble package build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install build tools and package dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep
          rosdep update || true
          rosdep install --from-paths . --ignore-src -r -y --rosdistro humble || true
      - name: Build description package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select four_dof_arm_description
